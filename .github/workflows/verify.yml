name: Verify

# Last updated: 2026-09-16 (v54.6)

# Runs scripts/verify.py (25 check categories: ids, tags, links, assets,
# JS syntax, version consistency, modules, sitemap, manifest, JSON-LD,
# file sizes, SW cache, robots.txt, global ID uniqueness, JS runtime safety,
# CSS integrity, deep a11y & SEO, data consistency, tracker hygiene, etc.) and
# fails the run if any check errors.
#
# Trigger: push and pull_request run the repository checks immediately. A
# workflow_run check also runs after "Update search index" so the generated
# search index is checked only after its commit-back has finished. Direct
# push/PR checks intentionally skip that generated-index assertion.
#
# The workflow_run trigger remains necessary because push-triggered workflows
# are suppressed for the indexer's "[skip ci]" commit and because a direct
# push check can race the index regeneration.
#
# Historical rationale for retaining workflow_run:
#
#   1. update-search-index.yml's commit-back uses "[skip ci]" in its
#      message — GitHub suppresses push/pull_request-triggered workflows.
# workflow_run fires only after the named workflow's job (including its
# commit-and-push step) has fully finished, so by the time this runs,
# assets/js/script.js already reflects any regeneration — no race, no
# skip-ci ambiguity, no sleep/retry guess.
#
# Read-only check: no commit-back, so no bot-loop-guard needed here
# (unlike stamp-last-commit.yml / update-search-index.yml).
#
# Caveat: workflow_run only fires for runs of the target workflow that
# happen AFTER this file exists on the default branch — the push that
# adds this file won't itself trigger a verify run; the next push will.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_run:
    workflows: ["Update search index"]
    types:
      - completed

# Least-privilege: read-only, this workflow never writes to the repo.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: JS syntax check (Node.js)
        run: |
          echo "Checking JavaScript syntax..."
          node --check assets/js/script.js
          node --check assets/js/bg-animations.js
          for f in assets/js/modules/*.js assets/js/data/*.js; do
            echo "  node --check $f"
            node --check "$f"
          done
          echo "All JS files pass syntax check."

      - name: Run JS Unit Tests
        run: node --test

      - name: Run E2E Smoke Tests
        run: python3 scripts/test_e2e.py

      - name: Run verify.py (full suite)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            python3 scripts/verify.py --verbose
          else
            python3 scripts/verify.py --verbose --skip-search-index
          fi
        env:
          FORCE_COLOR: "1"